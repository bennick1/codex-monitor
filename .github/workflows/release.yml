name: Signed Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-release-main
  cancel-in-progress: false

jobs:
  gate:
    if: github.repository == 'bennick1/codex-monitor' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      version: ${{ steps.gate.outputs.version }}
      tag: ${{ steps.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: gate
        run: node scripts/release-gate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node --test scripts/release-updater.node-test.mjs

  build:
    needs: gate
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            bundles: nsis
            target-args: --target x86_64-pc-windows-msvc
            bundle-dir: src-tauri/target/x86_64-pc-windows-msvc/release/bundle
          - os: macos-latest
            platform: macos
            bundles: app,dmg
            target-args: --target universal-apple-darwin
            bundle-dir: src-tauri/target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check:updater-policy
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test signed archive internal identity binding
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --locked --example verify_updater_signature
          CODEX_MONITOR_SIGNATURE_VERIFY_BIN="$PWD/src-tauri/target/debug/examples/verify_updater_signature" node --test scripts/release-updater.node-test.mjs
      - name: Validate signing configuration and build
        shell: bash
        env:
          CODEX_MONITOR_RELEASE_BUILD: '1'
          CODEX_MONITOR_UPDATER_PUBLIC_KEY: ${{ vars.CODEX_MONITOR_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$CODEX_MONITOR_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          node scripts/write-updater-build-config.mjs outputs/release-updater-config.json
          npm run tauri -- build --bundles ${{ matrix.bundles }} ${{ matrix.target-args }} --config outputs/release-updater-config.json
      - name: Record source and toolchain
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
          PLATFORM: ${{ matrix.platform }}
          BUNDLE_DIR: ${{ matrix.bundle-dir }}
          CODEX_MONITOR_RELEASE_BUILD: '1'
        run: node scripts/record-release-environment.mjs outputs/platform
      - name: Verify universal architecture
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app='${{ matrix.bundle-dir }}/macos/Codex Monitor.app'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = 'app.quotafloat.desktop'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = '${{ needs.gate.outputs.version }}'
          lipo "$app/Contents/MacOS/codex-monitor" -verify_arch arm64 x86_64
      - name: Verify signatures against client public key and collect
        env:
          CODEX_MONITOR_UPDATER_PUBLIC_KEY: ${{ vars.CODEX_MONITOR_UPDATER_PUBLIC_KEY }}
        run: node scripts/updater-artifacts.mjs collect ${{ matrix.platform }} "${{ matrix.bundle-dir }}" outputs/platform "${{ needs.gate.outputs.version }}" "${{ needs.gate.outputs.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-${{ matrix.platform }}-${{ needs.gate.outputs.sha }}
          path: outputs/platform/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [gate, build]
    environment: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-*-${{ needs.gate.outputs.sha }}
          path: outputs/incoming
          merge-multiple: true
      - name: Recheck remote version and tag before publication
        run: node scripts/release-gate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Assemble one complete manifest
        env:
          CODEX_MONITOR_UPDATER_PUBLIC_KEY: ${{ vars.CODEX_MONITOR_UPDATER_PUBLIC_KEY }}
        run: node scripts/updater-artifacts.mjs assemble outputs/incoming outputs/release "${{ needs.gate.outputs.version }}" "${{ needs.gate.outputs.sha }}"
      - name: Create draft, upload complete set, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.gate.outputs.tag }}
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --repo bennick1/codex-monitor --target "$SOURCE_SHA" --draft --title "Codex Monitor $RELEASE_TAG" --notes '用户主动检查、确认下载并安装。更新包包含 Tauri updater 签名。此签名不代表 Apple Developer ID、公证或 Windows Authenticode；平台证书尚未配置。'
          gh release upload "$RELEASE_TAG" outputs/release/* --repo bennick1/codex-monitor
          node scripts/verify-release-assets.mjs outputs/release "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --repo bennick1/codex-monitor --draft=false --latest
