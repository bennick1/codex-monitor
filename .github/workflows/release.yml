name: Release Preparation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            target-args: ''
            bundle-dir: src-tauri/target/release/bundle
            artifact-name: codex-monitor-v1.0.0-windows-x64-unsigned
          - os: macos-latest
            bundles: app,dmg
            target-args: --target universal-apple-darwin
            bundle-dir: src-tauri/target/universal-apple-darwin/release/bundle
            artifact-name: codex-monitor-v1.0.0-macos-universal-unsigned
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check:updater-policy
      - name: Validate V1 version and record build environment
        shell: pwsh
        run: |
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $tauri = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          if ($package.version -ne '1.0.0' -or $tauri.version -ne $package.version) {
            throw 'Expected matching V1.0.0 package and Tauri versions.'
          }
          New-Item -ItemType Directory -Force outputs/v1.0.0 | Out-Null
          @{
            commit = $env:GITHUB_SHA
            buildStartedAt = (Get-Date).ToUniversalTime().ToString('o')
            os = [System.Runtime.InteropServices.RuntimeInformation]::OSDescription
            runnerArch = $env:RUNNER_ARCH
            rust = (rustc --version)
            node = (node --version)
            npm = (npm --version)
            tauri = (npx tauri --version | Select-Object -Last 1)
            runUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            platformSigning = 'Not configured; candidate artifacts only'
          } | ConvertTo-Json | Set-Content -Encoding utf8 outputs/v1.0.0/build-environment.json
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Build candidate installer
        run: >-
          npm run tauri -- build --bundles ${{ matrix.bundles }} ${{ matrix.target-args }}
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Smoke test Windows NSIS installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem '${{ matrix.bundle-dir }}/nsis/*.exe')
          if ($installer.Count -ne 1 -or $installer[0].Length -lt 1MB) {
            throw "Expected exactly one non-empty NSIS installer."
          }
          $install = Start-Process -FilePath $installer[0].FullName -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Silent install failed: $($install.ExitCode)" }
          $entry = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
            ForEach-Object { Get-ItemProperty $_.PSPath } |
            Where-Object DisplayName -eq 'Codex Monitor' |
            Select-Object -First 1
          if (-not $entry) { throw 'Codex Monitor uninstall registration not found.' }
          $uninstaller = $entry.UninstallString.Trim('"')
          $installDir = Split-Path $uninstaller
          $executable = Get-ChildItem $installDir -Filter 'codex-monitor.exe' -Recurse | Select-Object -First 1
          if (-not $executable) { throw 'Installed codex-monitor.exe not found.' }
          $app = Start-Process -FilePath $executable.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "Installed app exited during smoke test: $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -PassThru -Wait
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed: $($uninstall.ExitCode)" }
      - name: Verify macOS bundle metadata
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find '${{ matrix.bundle-dir }}/macos' -maxdepth 1 -name 'Codex Monitor.app' -print -quit)"
          test -n "$app_path"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app_path/Contents/Info.plist")" = 'Codex Monitor'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Contents/Info.plist")" = '1.0.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist")" = 'app.quotafloat.desktop'
      - name: Name installers and generate SHA256
        run: node scripts/prepare-release-artifacts.mjs "${{ matrix.bundle-dir }}" outputs/v1.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: outputs/v1.0.0/
          if-no-files-found: error
          retention-days: 30
