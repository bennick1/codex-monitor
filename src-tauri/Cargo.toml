[package]
name = "codex-monitor"
version = "1.2.1"
description = "A lightweight, local-first Codex quota and token usage monitor"
authors = ["Quota Float contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "quota_float_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
same-file = "1"
libc = "0.2"
sha2 = "0.10"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["macros", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Reuse the exact AppKit bindings already locked by Tauri; no window framework.
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSApplication", "NSEvent", "block2", "NSVisualEffectView", "NSView", "NSResponder", "NSImage", "NSBezierPath", "NSColor", "NSGraphics", "NSAppearance", "NSWorkspace", "NSAccessibility"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSNotification", "NSOperation", "NSString", "block2"] }
block2 = "0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
# Reuse Tauri's locked WinRT bindings for local, clipped desktop material.
windows = { version = "0.61.3", features = ["Foundation", "Graphics", "Graphics_Effects", "System", "UI_Composition", "UI_Composition_Desktop", "UI_ViewManagement", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Dwm", "Win32_System_SystemInformation", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "Win32_System_WinRT_Graphics_Direct2D"] }
windows-core = "0.61.2"
windows-numerics = "0.2.0"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
