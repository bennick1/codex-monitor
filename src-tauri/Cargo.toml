[package]
name = "codex-monitor"
version = "1.0.0"
description = "A lightweight, local-first Codex quota and token usage monitor"
authors = ["Quota Float contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "quota_float_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
same-file = "1"
libc = "0.2"
sha2 = "0.10"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["macros", "sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Reuse the exact AppKit bindings already locked by Tauri; no window framework.
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWindow", "NSApplication"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
