<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="195 183 864 864">
  <title>CM — 16/20px optical derivative of the approved reconstruction</title>
  <desc>C + M + segmented monitoring arc. Coordinates trace the central tile of app-icon-reference.png; the presentation canvas and exterior shadow are excluded.</desc>
  <defs>
    <linearGradient id="tile" x1="250" y1="200" x2="960" y2="1040" gradientUnits="userSpaceOnUse"><stop stop-color="#2a3745"/><stop offset=".42" stop-color="#101820"/><stop offset="1" stop-color="#080d15"/></linearGradient>
    <linearGradient id="rim" x1="260" y1="220" x2="970" y2="1000" gradientUnits="userSpaceOnUse"><stop stop-color="#6098cb"/><stop offset=".25" stop-color="#3b4859"/><stop offset=".65" stop-color="#141e2b"/><stop offset="1" stop-color="#3b485a"/></linearGradient>
    <linearGradient id="c-material" x1="580" y1="298" x2="580" y2="912" gradientUnits="userSpaceOnUse"><stop stop-color="#77ffd0"/><stop offset=".20" stop-color="#13ece8"/><stop offset=".47" stop-color="#13aafa"/><stop offset=".70" stop-color="#086efa"/><stop offset="1" stop-color="#2252cd"/></linearGradient>
    <linearGradient id="c-edge" x1="510" y1="295" x2="510" y2="910" gradientUnits="userSpaceOnUse"><stop stop-color="#b2ffe8"/><stop offset=".5" stop-color="#00d4ff"/><stop offset="1" stop-color="#3466ff"/></linearGradient>
    <linearGradient id="m-material" x1="590" y1="480" x2="730" y2="855" gradientUnits="userSpaceOnUse"><stop stop-color="#f7fcfc"/><stop offset=".29" stop-color="#d9f1fa"/><stop offset=".63" stop-color="#a7cffd"/><stop offset="1" stop-color="#5494d5"/></linearGradient>
    <linearGradient id="m-blue" x1="505" y1="555" x2="505" y2="782" gradientUnits="userSpaceOnUse"><stop stop-color="#c9edf7" stop-opacity="0"/><stop offset="1" stop-color="#0586e5"/></linearGradient>
    <linearGradient id="status" x1="685" y1="300" x2="940" y2="610" gradientUnits="userSpaceOnUse"><stop stop-color="#22f2aa"/><stop offset=".24" stop-color="#1cdab4"/><stop offset=".48" stop-color="#20a5b4"/><stop offset=".70" stop-color="#42647e"/><stop offset="1" stop-color="#323d4e"/></linearGradient>
    <linearGradient id="tail" x1="909" y1="597" x2="856" y2="827" gradientUnits="userSpaceOnUse"><stop stop-color="#25313e"/><stop offset="1" stop-color="#0e1722"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#00cdbb" stop-opacity=".13"/><stop offset="1" stop-color="#00cdbb" stop-opacity="0"/></radialGradient>
    <filter id="soft-glow" x="-.2" y="-.2" width="1.4" height="1.4"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="tile-clip"><rect x="199" y="187" width="856" height="856" rx="201"/></clipPath>
    <path id="c" d="M631 298 C637 298 639 302 639 309 L639 370 Q639 382 627 382 C505 379 397 478 397 608 C397 725 479 819 596 820 C630 820 663 811 691 796 C710 783 728 799 728 820 L728 871 Q728 881 718 886 C681 903 643 911 607 911 C442 911 307 776 307 609 C307 439 450 298 631 298 Z"/>
    <path id="m" d="M471 728 L471 517 C471 483 509 466 533 490 L665 615 Q676 626 687 615 L783 526 C808 504 850 518 850 557 L850 822 Q850 827 846 831 Q817 859 781 880 Q775 883 775 875 L775 630 L695 701 Q676 718 658 699 L544 591 L544 777 Q544 785 536 781 C515 773 491 757 477 742 Q471 736 471 728 Z"/>
  </defs>
  <rect id="app-tile" x="199" y="187" width="856" height="856" rx="201" fill="url(#tile)" stroke="#111b29" stroke-width="3"/>
  <g clip-path="url(#tile-clip)">
    <ellipse cx="606" cy="393" rx="300" ry="210" fill="url(#glow)"/>

    <rect x="202" y="190" width="850" height="850" rx="199" fill="none" stroke="url(#rim)" stroke-width="4" opacity=".72"/>
    <g id="segmented-arc" fill="url(#status)" stroke="#91cfd8" stroke-opacity=".18" stroke-width="1.5" stroke-linejoin="round">
      <path d="M671.54 293.11 A320 320 0 0 1 787.00 332.87 L752.00 393.49 A250 250 0 0 0 661.79 362.43 Z"/>
      <path d="M849.29 379.81 A320 320 0 0 1 919.33 479.84 L855.39 508.32 A250 250 0 0 0 800.66 430.17 Z"/>
      <path d="M942.14 554.43 A320 320 0 0 1 946.81 598.83 L876.85 601.28 A250 250 0 0 0 873.20 566.59 Z"/>
    </g>
    <path id="arc-tail" d="M892 602 L942 598 Q950 598 949 606 C950 687 914 765 851 821 L851 714 C875 677 886 644 886 608 Q886 602 892 602 Z" fill="url(#tail)"/>
    <use id="letter-c" href="#c" fill="url(#c-material)" stroke="url(#c-edge)" stroke-width="2"/>
    <use id="letter-m" href="#m" fill="url(#m-material)" stroke="#e7f6ff" stroke-opacity=".75" stroke-width="5"/>
    <path d="M472 552 L544 592 L544 777 Q544 784 536 781 C515 773 491 757 477 742 Q472 737 472 728 Z" fill="url(#m-blue)"/>
  </g>
</svg>
